app = "linknode-eagle-monitor"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  PORT = "5000"
  # SQLite store and alert state live on the eagle_data volume
  DB_PATH = "/data/energy.db"
  MONITOR_STATE_FILE = "/data/monitor_state.json"

# One volume, one machine: never scale this app past 1 (each machine would get
# its own separate database).
[mounts]
  source = "eagle_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 5000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = false

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    restart_limit = 6

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    restart_limit = 6
    path = "/health"
    protocol = "http"
    method = "GET"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256