app = "linknode-eagle-monitor"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  PORT = "5000"
  # SQLite store and alert state live on the eagle_data volume
  DB_PATH = "/data/energy.db"
  MONITOR_STATE_FILE = "/data/monitor_state.json"
  # Minutes before the newest reading counts as stale (the alarm and /health/data).
  # Must be an integer. The Pi watchdog's WATCH_BACKSTOP_SECS has to stay well above
  # this many minutes: see docs/ALERTING.md.
  STALE_THRESHOLD_MINUTES = "30"

# One volume, one machine: never scale this app past 1 (each machine would get
# its own separate database).
[mounts]
  source = "eagle_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 5000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = false

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Every open page holds one connection for its live stream, so the limits sit well
  # clear of the number of pages likely to be open: uploads and the watchdog's checks
  # must still get in.
  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  # While a check fails Fly stops routing to the machine. It does not restart it.
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    path = "/health"
    protocol = "http"
    method = "GET"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256