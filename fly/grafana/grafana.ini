[server]
http_addr = 0.0.0.0
http_port = 3000
root_url = https://linknode-grafana.fly.dev/
serve_from_sub_path = false
enable_gzip = true

[database]
type = sqlite3
wal = true
cache_mode = shared
max_open_conns = 10
max_idle_conns = 5

[session]
provider = memory

[security]
admin_user = admin
# admin_password is set via GF_SECURITY_ADMIN_PASSWORD environment variable
allow_embedding = true
cookie_samesite = none
cookie_secure = true
content_security_policy = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
viewers_can_edit = false
default_theme = dark

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = false

[rbac]
permission_cache_enabled = false
enabled = false

[feature_toggles]
enable = publicDashboards

[public_dashboards]
enabled = true

[auth.basic]
enabled = true

[auth.proxy]
enabled = false

[log]
level = info

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/power-monitoring.json
min_refresh_interval = 5s

[panels]
disable_sanitize_html = true

[dataproxy]
timeout = 30

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[analytics]
reporting_enabled = false
check_for_updates = false

[explore]
enabled = false

[alerting]
enabled = false

[unified_alerting]
enabled = false

[news]
news_feed_enabled = false

[help]
enabled = false

[profile]
enabled = false

[admin]
# Hide admin menu items from non-admins
default_language = en-US