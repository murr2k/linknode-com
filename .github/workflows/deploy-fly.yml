name: Deploy to Fly.io

# The only Fly app is linknode-eagle-monitor: the ingest API and its SQLite store
# (volume eagle_data). The site deploys to Cloudflare separately (deploy-web.yml).

on:
  push:
    branches: [ main ]
    paths:
      - 'fly/eagle-monitor/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP: linknode-eagle-monitor

# One deploy at a time; never cancel one mid-flight
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  queue-monitor:
    name: Queue Time Monitor
    uses: ./.github/workflows/queue-monitor-reusable.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [queue-monitor]
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Test Eagle Monitor
      run: |
        pip install -q -r fly/eagle-monitor/requirements.txt
        python -m unittest discover -s fly/eagle-monitor -p "test_*.py"

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Capture current image for rollback
      id: versions
      run: |
        TAG=$(flyctl image show -a "$APP" -j 2>/dev/null | jq -r .Tag 2>/dev/null || true)
        if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
          echo "::warning::Could not capture the current image; rollback will not be possible"
          echo "image=none" >> $GITHUB_OUTPUT
        else
          echo "image=registry.fly.io/$APP:$TAG" >> $GITHUB_OUTPUT
          echo "Current image: registry.fly.io/$APP:$TAG"
        fi

    - name: Deploy Eagle Monitor
      run: |
        cd fly/eagle-monitor

        # Deploy with retry logic
        RETRY_COUNT=0
        MAX_RETRIES=2

        while [ $RETRY_COUNT -le $MAX_RETRIES ]; do
          echo "Deployment attempt $((RETRY_COUNT + 1)) of $((MAX_RETRIES + 1))..."

          if flyctl deploy --remote-only --wait-timeout 300; then
            echo "✅ Eagle Monitor deployed successfully"

            # Verify deployment health
            sleep 10
            if curl -sf https://linknode-eagle-monitor.fly.dev/health -m 10; then
              echo "✅ Eagle Monitor health check passed"
              break
            else
              echo "⚠️ Eagle Monitor health check failed"
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Maximum retries reached"
                exit 1
              fi
            fi
          else
            echo "❌ Deployment failed"
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              IMAGE="${{ steps.versions.outputs.image }}"
              if [ "$IMAGE" != "none" ]; then
                echo "🔄 Rolling back to $IMAGE"
                flyctl deploy --image "$IMAGE" -a "$APP" --yes || true
              fi
              exit 1
            fi
          fi

          RETRY_COUNT=$((RETRY_COUNT + 1))
          [ $RETRY_COUNT -le $MAX_RETRIES ] && echo "Waiting 30 seconds before retry..." && sleep 30
        done

    - name: Deployment summary
      if: always()
      run: |
        flyctl status -a "$APP" || true
        {
          echo "## 🚀 Fly.io Deployment"
          echo "- **App**: $APP"
          echo "- **API**: https://linknode-eagle-monitor.fly.dev/api/stats"
          echo "- **Health**: https://linknode-eagle-monitor.fly.dev/health"
          echo "- **Site**: https://linknode.com (Cloudflare, deploy-web.yml)"
          echo "- **Commit**: ${{ github.sha }}"
          echo "- **Triggered by**: ${{ github.actor }}"
        } >> $GITHUB_STEP_SUMMARY

    # Slack notifications come from the GitHub Slack app (/github subscribe
    # murr2k/linknode-com workflows in #linknode-com); no secrets needed here.
